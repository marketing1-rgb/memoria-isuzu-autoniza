<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Desafío Isuzu</title>

<link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
    color: white;

    background:
        url('fondo.png')
        center center / cover
        no-repeat;

    touch-action: manipulation;
    user-select: none;
}


/* =========================================================
   ESTRUCTURA GENERAL
========================================================= */

.container {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: grid;

    grid-template-rows:
        auto
        1fr
        auto;

    overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding-top:
        clamp(22px, 2.8vh, 45px);

    position: relative;
    z-index: 5;
}


/* =========================================================
   CONTENEDOR DEL TÍTULO
========================================================= */

.title-frame {
    width: 100%;

    height:
        clamp(155px, 19vh, 275px);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: visible;
}


/* =========================================================
   TÍTULO COMPLETO
========================================================= */

.title-logo {
    display: flex;
    flex-direction: column;
    align-items: center;

    line-height: .67;

    transform:
        skewX(-8deg)
        scale(1.12);

    transform-origin: center;

    filter:
        drop-shadow(
            0 8px 3px
            rgba(0,0,0,.55)
        );
}


/* =========================================================
   DESAFÍO
========================================================= */

.title-desafio {
    font-size:
        clamp(62px, 12.5vw, 130px);

    font-weight: 900;
    font-style: italic;

    letter-spacing: -4px;

    white-space: nowrap;

    color: #ffffff;

    -webkit-text-stroke:
        1px rgba(95,95,95,.68);

    text-shadow:
        1px 1px 0 #d6d6d6,
        2px 2px 0 #aaaaaa,
        3px 3px 0 #777777,
        5px 6px 0 rgba(0,0,0,.55);
}


/* =========================================================
   ISUZU
========================================================= */

.title-isuzu {
    font-size:
        clamp(90px, 18vw, 185px);

    font-weight: 900;
    font-style: italic;

    letter-spacing: -8px;

    white-space: nowrap;

    color: #ffffff;

    margin-top: 6px;

    -webkit-text-stroke:
        1px rgba(95,95,95,.68);

    text-shadow:
        1px 1px 0 #d6d6d6,
        2px 2px 0 #aaaaaa,
        3px 3px 0 #777777,
        5px 6px 0 rgba(0,0,0,.55);
}


/* =========================================================
   ZONA CENTRAL
========================================================= */

.center-area {
    width: 100%;
    min-height: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    transform:
        translateY(-1vh);

    padding:
        clamp(8px, 1vh, 16px)
        0
        clamp(12px, 1.5vh, 24px);
}


/* =========================================================
   SUBTÍTULO
========================================================= */

.subtitle {
    flex-shrink: 0;

    font-size:
        clamp(17px, 3.5vw, 32px);

    font-weight: 900;
    font-style: italic;

    text-align: center;
    text-transform: uppercase;

    white-space: nowrap;

    margin:
        0
        0
        clamp(18px, 2.2vh, 30px);

    text-shadow:
        0 3px 5px
        rgba(0,0,0,.45);
}


/* =========================================================
   CONTADOR
========================================================= */

#contador {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    height: 0;

    overflow: visible;

    font-size:
        clamp(28px, 5vw, 52px);

    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 0 8px #ffffff,
        0 0 17px #ff0011;
}


/* SOLO OCUPA ESPACIO CUANDO APARECE */

#contador:not(:empty) {
    height:
        clamp(38px, 4.5vh, 55px);

    margin-top: -4px;

    margin-bottom:
        clamp(8px, 1vh, 14px);
}


/* =========================================================
   BLOQUE DE CARTAS
========================================================= */

.game-section {
    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-shrink: 0;

    margin: 0;
    padding: 0;

    border: none;
    background: transparent;
}


/* =========================================================
   TABLERO
========================================================= */

.game {
    width:
        min(88%, 760px);

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        clamp(8px, 1.3vw, 15px);

    margin:
        0 auto;
}


/* =========================================================
   CARTAS
========================================================= */

.card {
    width: 100%;

    aspect-ratio:
        3 / 4;

    border-radius:
        clamp(18px, 2.5vw, 28px);

    perspective:
        1200px;

    cursor: pointer;

    transition:
        transform .18s ease;
}

.card:active {
    transform:
        scale(.97);
}


/* =========================================================
   INTERIOR DE LA CARTA
========================================================= */

.inner {
    width: 100%;
    height: 100%;

    position: relative;

    border-radius:
        inherit;

    transform-style:
        preserve-3d;

    transition:
        transform .55s
        cubic-bezier(.4,.2,.2,1);
}


/* GIRO */

.card.flip .inner {
    transform:
        rotateY(180deg);
}


/* =========================================================
   CARAS
========================================================= */

.front,
.back {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border-radius:
        inherit;

    overflow: hidden;

    backface-visibility:
        hidden;

    -webkit-backface-visibility:
        hidden;

    box-shadow:
        0 6px 10px
        rgba(0,0,0,.38),

        0 0 0 2px
        rgba(115,0,0,.75);
}


/* =========================================================
   REVERSO DE LA CARTA
========================================================= */

.back {
    display: flex;

    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f8f8f8 52%,
            #e7e7e7 100%
        );
}


/* LOGO ISUZU */

.back::after {
    content: '';

    width: 58%;
    height: 28%;

    background:
        url('logo-isuzu.png')
        center / contain
        no-repeat;
}


/* =========================================================
   PREMIO
========================================================= */

.front {
    transform:
        rotateY(180deg);

    background-color:
        #ffffff;

    background-position:
        center;

    background-size:
        cover;

    background-repeat:
        no-repeat;
}


/* =========================================================
   CARTA GANADORA
========================================================= */

.card.ganadora {
    animation:
        glowGanador
        .6s ease
        infinite alternate;
}


@keyframes glowGanador {

    from {

        transform:
            scale(1);

        filter:
            drop-shadow(
                0 0 5px #ffd000
            );
    }

    to {

        transform:
            scale(1.045);

        filter:
            drop-shadow(
                0 0 14px #ffd000
            )
            drop-shadow(
                0 0 20px #ff7800
            );
    }

}


/* =========================================================
   ÁREA DEL BOTÓN
========================================================= */

.controls {
    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    flex:
        0 0 auto;

    min-height: 0;

    margin-top:
        clamp(28px, 3.5vh, 48px);

    padding: 0;
}


/* =========================================================
   BOTÓN INICIAR
========================================================= */

.controls button {
    position: relative;

    width:
        clamp(250px, 42vw, 400px);

    height:
        clamp(50px, 6vh, 70px);

    padding:
        0 58px;

    border:
        2px solid #ffffff;

    border-radius:
        12px;

    outline:
        none;

    background:
        linear-gradient(
            180deg,
            #e60c17 0%,
            #c9000d 55%,
            #a50008 100%
        );

    color:
        #ffffff;

    font-family:
        'Montserrat',
        sans-serif;

    font-size:
        clamp(20px, 2.8vw, 30px);

    font-weight:
        900;

    font-style:
        italic;

    cursor:
        pointer;

    box-shadow:
        inset 0 2px 3px
        rgba(255,255,255,.28),

        0 4px 0
        #680006,

        0 6px 10px
        rgba(0,0,0,.35),

        0 0 7px
        rgba(255,0,0,.45);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


/* FLECHA IZQUIERDA */

.controls button::before {
    content: '«';

    position: absolute;

    left: 18px;
    top: 50%;

    transform:
        translateY(-52%);

    font-size:
        .8em;

    font-weight:
        900;
}


/* FLECHA DERECHA */

.controls button::after {
    content: '»';

    position: absolute;

    right: 18px;
    top: 50%;

    transform:
        translateY(-52%);

    font-size:
        .8em;

    font-weight:
        900;
}


.controls button:active {
    transform:
        translateY(3px)
        scale(.98);

    box-shadow:
        inset 0 2px 3px
        rgba(255,255,255,.25),

        0 2px 0
        #680006,

        0 4px 7px
        rgba(0,0,0,.35);
}


.controls button:disabled {
    opacity: .5;

    pointer-events: none;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    width: 100%;

    height:
        clamp(125px, 16vh, 200px);

    display: flex;

    justify-content: center;
    align-items: flex-start;

    padding-top:
        clamp(24px, 3vh, 40px);

    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(118,0,5,.55) 0%,
            rgba(70,0,4,.82) 30%,
            rgba(35,0,2,.95) 65%,
            #050000 100%
        );

    border-top:
        2px solid
        rgba(255,45,45,.43);
}


/* LÍNEA SUPERIOR */

.footer::before {
    content: '';

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1824 18%,
            #ff3e47 50%,
            #ff1824 82%,
            transparent
        );

    box-shadow:
        0 0 8px
        rgba(255,0,0,.8);
}


/* BRILLO */

.footer::after {
    content: '';

    position: absolute;

    top: -25%;
    left: 50%;

    transform:
        translateX(-50%);

    width: 80%;
    height: 90%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(180,0,8,.22),
            transparent 70%
        );

    pointer-events:
        none;
}


/* LOGO AUTONIZA */

.footer img {
    width:
        min(56%, 460px);

    max-height:
        92px;

    object-fit:
        contain;

    position: relative;

    z-index: 2;

    filter:
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.55)
        );
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 30px;

    background:
        rgba(0,0,0,.84);

    backdrop-filter:
        blur(5px);

    z-index: 999;
}


/* =========================================================
   POPUP
========================================================= */

.popup {
    width:
        min(82%, 500px);

    padding:
        35px 30px;

    border-radius:
        22px;

    border:
        3px solid #e30613;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #ededed
        );

    color:
        #222222;

    text-align:
        center;

    box-shadow:
        0 0 40px
        rgba(227,6,19,.8),

        0 20px 35px
        rgba(0,0,0,.6);

    animation:
        popIn .35s ease;
}


@keyframes popIn {

    from {
        opacity: 0;
        transform: scale(.55);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================================================
   IMAGEN PREMIO
========================================================= */

.popup-premio {
    display: none;

    width:
        min(70%, 250px);

    aspect-ratio:
        1 / 1;

    object-fit:
        contain;

    border-radius:
        15px;

    margin:
        0 auto 20px;
}


/* =========================================================
   TEXTO POPUP
========================================================= */

.popup h2 {
    font-size:
        clamp(24px, 3vh, 38px);

    font-weight: 900;

    margin-bottom:
        22px;
}


.popup h2 strong {
    display: inline-block;

    margin-top: 10px;

    color: #e30613;
}


/* =========================================================
   BOTÓN POPUP
========================================================= */

.popup button {
    width: 100%;

    padding:
        15px 20px;

    border: none;

    border-radius:
        12px;

    background:
        linear-gradient(
            #ee1721,
            #b9000b
        );

    color: #ffffff;

    font-family:
        'Montserrat',
        sans-serif;

    font-size:
        clamp(17px, 2vh, 22px);

    font-weight:
        800;

    cursor:
        pointer;
}


/* =========================================================
   PANTALLAS ANGOSTAS
========================================================= */

@media (max-width: 600px) {

    .header {
        padding-top: 20px;
    }


    .title-frame {
        height: 150px;
    }


    .title-logo {
        transform:
            skewX(-8deg)
            scale(1.08);
    }


    .title-desafio {
        font-size:
            clamp(56px, 14vw, 76px);
    }


    .title-isuzu {
        font-size:
            clamp(80px, 20vw, 108px);
    }


    .center-area {
        transform:
            translateY(-1vh);

        padding:
            8px
            0
            16px;
    }


    .subtitle {
        margin-bottom: 18px;

        font-size:
            clamp(15px, 4vw, 21px);
    }


    .game {
        width: 88%;

        gap: 7px;
    }


    .card {
        border-radius: 15px;
    }


    .controls {
        margin-top: 32px;
    }


    .controls button {
        width:
            clamp(210px, 55vw, 300px);

        height: 48px;

        font-size:
            clamp(18px, 4.5vw, 23px);
    }


    .footer {
        height: 120px;

        padding-top: 23px;
    }


    .footer img {
        width: 61%;
    }

}


/* =========================================================
   PANTALLAS BAJAS
========================================================= */

@media (max-height: 850px) {

    .header {
        padding-top: 10px;
    }


    .title-frame {
        height: 120px;
    }


    .title-logo {
        transform:
            skewX(-8deg)
            scale(1.06);
    }


    .title-desafio {
        font-size:
            clamp(46px, 10vw, 65px);
    }


    .title-isuzu {
        font-size:
            clamp(66px, 14vw, 92px);
    }


    .center-area {
        transform:
            translateY(-1vh);

        padding:
            4px
            0
            8px;
    }


    .subtitle {
        margin-bottom: 12px;

        font-size:
            clamp(14px, 3vw, 19px);
    }


    #contador:not(:empty) {
        height: 28px;

        margin-bottom: 4px;
    }


    .game {
        width:
            min(80%, 620px);

        gap: 7px;
    }


    .controls {
        margin-top: 20px;
    }


    .controls button {
        height: 43px;

        font-size:
            clamp(17px, 2.7vw, 26px);
    }


    .footer {
        height: 98px;

        padding-top: 17px;
    }


    .footer img {
        max-height: 62px;
    }

}


/* =========================================================
   TÓTEM ALTO
========================================================= */

@media (min-height: 1100px) {

    .header {
        padding-top:
            clamp(32px, 3.5vh, 58px);
    }


    .title-frame {
        height:
            clamp(180px, 20vh, 290px);
    }


    .title-logo {
        transform:
            skewX(-8deg)
            scale(1.15);
    }


    .title-desafio {
        font-size:
            clamp(70px, 13vw, 140px);
    }


    .title-isuzu {
        font-size:
            clamp(100px, 18.5vw, 195px);
    }


    .center-area {
        transform:
            translateY(-1vh);
    }


    .subtitle {
        margin-bottom:
            clamp(22px, 2.5vh, 38px);
    }


    .game {
        width:
            min(88%, 780px);
    }


    .controls {
        margin-top:
            clamp(32px, 4vh, 55px);
    }


    .footer {
        height:
            clamp(145px, 16vh, 205px);
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <header class="header">

        <div class="title-frame">

            <div class="title-logo">

                <div class="title-desafio">
                    DESAFÍO
                </div>

                <div class="title-isuzu">
                    ISUZU
                </div>

            </div>

        </div>

    </header>



    <!-- =====================================================
         ZONA CENTRAL
    ====================================================== -->

    <main class="center-area">


        <!-- SUBTÍTULO -->

        <div class="subtitle">
            PON A PRUEBA TU MEMORIA
        </div>


        <!-- CONTADOR -->

        <div id="contador"></div>


        <!-- CARTAS -->

        <div class="game-section">

            <div
                class="game"
                id="game"
            ></div>

        </div>


        <!-- BOTÓN INICIAR -->

        <div class="controls">

            <button
                id="btnIniciar"
                onclick="iniciarJuego()"
            >
                INICIAR
            </button>

        </div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <img
            src="logo-autoniza.png"
            alt="Autoniza"
        >

    </footer>


</div>



<!-- =========================================================
     POPUP RESULTADO
========================================================= -->

<div
    class="overlay"
    id="overlay"
>

    <div class="popup">

        <img
            id="popupPremio"
            class="popup-premio"
            src=""
            alt="Premio"
        >

        <h2 id="mensaje"></h2>

        <button
            onclick="reiniciarJuego()"
        >
            JUGAR DE NUEVO
        </button>

    </div>

</div>



<!-- =========================================================
     AUDIO
========================================================= -->

<audio
    id="flipSound"
    src="flip.mp3"
    preload="auto"
></audio>

<audio
    id="winSound"
    src="win.mp3"
    preload="auto"
></audio>

<audio
    id="loseSound"
    src="lose.mp3"
    preload="auto"
></audio>

<audio
    id="bgMusic"
    src="musica.mp3"
    preload="auto"
    loop
></audio>



<script>

/* =========================================================
   PREMIOS
========================================================= */

const premios = [

    {
        img: 'premio1.png',
        nombre: 'TERMÓMETRO DIGITAL'
    },

    {
        img: 'premio2.png',
        nombre: 'LANYARD'
    },

    {
        img: 'premio3.png',
        nombre: 'POLO ISUZU'
    },

    {
        img: 'premio4.png',
        nombre: 'GORRA ISUZU'
    }

];


/* =========================================================
   VARIABLES
========================================================= */

let cartas = [];

let primera = null;

let segunda = null;

let bloqueo = true;

let puedeJugar = false;

let resultadoMostrado = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const game =
    document.getElementById('game');

const contador =
    document.getElementById('contador');

const overlay =
    document.getElementById('overlay');

const mensaje =
    document.getElementById('mensaje');

const popupPremio =
    document.getElementById('popupPremio');

const btnIniciar =
    document.getElementById('btnIniciar');

const flipSound =
    document.getElementById('flipSound');

const winSound =
    document.getElementById('winSound');

const loseSound =
    document.getElementById('loseSound');

const bgMusic =
    document.getElementById('bgMusic');


/* =========================================================
   MEZCLAR CARTAS
========================================================= */

function mezclar(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================================================
   SONIDO
========================================================= */

function reproducirSonido(audio) {

    try {

        audio.pause();

        audio.currentTime = 0;

        audio
            .play()
            .catch(() => {});

    }

    catch (error) {

        console.log(error);

    }

}


/* =========================================================
   CREAR TABLERO
========================================================= */

function crearTablero() {

    game.innerHTML = '';


    cartas = [

        ...premios,

        ...premios

    ];


    mezclar(cartas);


    cartas.forEach(premio => {


        const card =
            document.createElement('div');


        card.classList.add('card');


        card.innerHTML = `

            <div class="inner">

                <div
                    class="front"
                    style="
                        background-image:
                        url('${premio.img}');
                    "
                ></div>

                <div class="back"></div>

            </div>

        `;


        card.addEventListener(

            'click',

            () =>

                clickCard(
                    card,
                    premio
                )

        );


        game.appendChild(card);

    });

}


/* =========================================================
   INICIAR JUEGO
========================================================= */

async function iniciarJuego() {


    if (
        puedeJugar ||
        !bloqueo
    ) {

        return;

    }


    primera = null;

    segunda = null;

    bloqueo = true;

    puedeJugar = false;

    resultadoMostrado = false;


    btnIniciar.disabled = true;


    /* MÚSICA */

    bgMusic.volume = .18;


    try {

        await bgMusic.play();

    }

    catch (error) {}


    const cards =
        document.querySelectorAll('.card');


    /* MOSTRAR PREMIOS */

    reproducirSonido(
        flipSound
    );


    cards.forEach(

        card =>

            card.classList.add(
                'flip'
            )

    );


    /* =====================================================
       CUENTA REGRESIVA RÁPIDA
    ===================================================== */

    contador.innerText = '3';

    await esperar(200);


    contador.innerText = '2';

    await esperar(200);


    contador.innerText = '1';

    await esperar(200);


    contador.innerText = '';


    /* =====================================================
       OCULTAR CARTAS
    ===================================================== */

    reproducirSonido(
        flipSound
    );


    cards.forEach(

        card =>

            card.classList.remove(
                'flip'
            )

    );


    await esperar(550);


    bloqueo = false;

    puedeJugar = true;

}


/* =========================================================
   CLICK EN CARTA
========================================================= */

function clickCard(
    card,
    premio
) {


    if (
        bloqueo ||
        !puedeJugar ||
        card.classList.contains('flip')
    ) {

        return;

    }


    reproducirSonido(
        flipSound
    );


    card.classList.add(
        'flip'
    );


    /* PRIMERA CARTA */

    if (!primera) {


        primera = {

            card,

            premio

        };


        return;

    }


    /* SEGUNDA CARTA */

    segunda = {

        card,

        premio

    };


    bloqueo = true;

    puedeJugar = false;


    comprobarResultado();

}


/* =========================================================
   COMPROBAR RESULTADO
========================================================= */

async function comprobarResultado() {


    await esperar(1000);


    const coincide =

        primera.premio.nombre ===
        segunda.premio.nombre;


    /* GANÓ */

    if (coincide) {


        primera
            .card
            .classList
            .add('ganadora');


        segunda
            .card
            .classList
            .add('ganadora');


        await esperar(450);


        mostrarResultado(

            true,

            primera.premio

        );

    }


    /* NO COINCIDE */

    else {


        reproducirSonido(
            flipSound
        );


        primera
            .card
            .classList
            .remove('flip');


        segunda
            .card
            .classList
            .remove('flip');


        await esperar(400);


        mostrarResultado(false);

    }

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
    gano,
    premio = null
) {


    if (resultadoMostrado) {

        return;

    }


    resultadoMostrado = true;


    bgMusic.pause();


    /* GANADOR */

    if (gano) {


        reproducirSonido(
            winSound
        );


        mensaje.innerHTML = `

            🎉 ¡GANASTE! 🎉

            <br>

            <strong>
                ${premio.nombre}
            </strong>

        `;


        popupPremio.src =
            premio.img;


        popupPremio.style.display =
            'block';

    }


    /* PERDEDOR */

    else {


        reproducirSonido(
            loseSound
        );


        mensaje.innerHTML = `

            INTÉNTALO

            <br>

            DE NUEVO

        `;


        popupPremio.src = '';


        popupPremio.style.display =
            'none';

    }


    overlay.style.display =
        'flex';

}


/* =========================================================
   REINICIAR
========================================================= */

function reiniciarJuego() {


    overlay.style.display =
        'none';


    primera = null;

    segunda = null;

    bloqueo = true;

    puedeJugar = false;

    resultadoMostrado = false;


    contador.innerText = '';


    btnIniciar.disabled =
        false;


    bgMusic.pause();

    bgMusic.currentTime = 0;


    popupPremio.src = '';

    popupPremio.style.display =
        'none';


    crearTablero();

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(ms) {

    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}


/* =========================================================
   EVITAR DOBLE TAP EN TÓTEM
========================================================= */

let ultimoTouch = 0;


document.addEventListener(

    'touchend',

    function(event) {


        const ahora =
            Date.now();


        if (
            ahora -
            ultimoTouch <=
            300
        ) {

            event.preventDefault();

        }


        ultimoTouch = ahora;

    },

    {
        passive: false
    }

);


/* =========================================================
   INICIALIZAR
========================================================= */

crearTablero();

</script>
